[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-strength"
version = "0.1.0"
description = "Path Drive Points (PDP) — deterministic drive-level NFL strength metric"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nflreadpy>=0.1.0; python_version >= '3.10'",
    "nfl_data_py>=0.3.0; python_version < '3.10'",
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
pdp = "drive_strength.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drive_strength*"]
